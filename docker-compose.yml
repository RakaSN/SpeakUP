version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: speakup-db
    environment:
      POSTGRES_USER: speakup_admin
      POSTGRES_PASSWORD: speakup_password
      POSTGRES_DB: speakup_db
    ports:
      - "5432:5432"
    volumes:
      - speakup_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakup_admin -d speakup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakup-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://speakup_admin:speakup_password@db:5432/speakup_db?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_SECRET=your-secure-secret-key-for-rc1-change-in-prod
      - NODE_ENV=production
    ports:
      - "3000:3000"
    restart: unless-stopped
    command: >
      sh -c "npx prisma migrate deploy && 
             node server.js"

volumes:
  speakup_data:
